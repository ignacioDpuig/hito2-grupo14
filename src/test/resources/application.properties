# Los tests corren contra una base H2 en memoria: no necesitan MySQL ni tocan la base de desarrollo.
# Se crea vacía en cada arranque y se carga con el mismo data.sql de la aplicación.
spring.datasource.url=jdbc:h2:mem:hito2_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER,VALUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

