spring.application.name=hito2

# Credenciales locales (mail, base de datos) en un archivo .env en la raíz del proyecto.
# Es opcional y no se sube al repositorio: ver .env.example
spring.config.import=optional:file:.env[.properties]
server.port=8080

# URL pública de la app, se usa en los links de los mails
app.base-url=${APP_BASE_URL:http://localhost:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hito2_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# Una sesión de Hibernate por request: la unidad que resuelve @UnidadDelResponsable sigue administrada en los services
# y las vistas pueden leer relaciones lazy (festival de la unidad, staff...)
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000
spring.mail.properties.mail.smtp.connectionpool.debug=true
