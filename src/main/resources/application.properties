spring.application.name=hito2

# Credenciales locales (mail, base de datos) en un archivo .env en la raíz del proyecto.
# Es opcional y no se sube al repositorio: ver .env.example
spring.config.import=optional:file:.env[.properties]
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hito2_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# Una sesión de Hibernate por request: la unidad que resuelve @UnidadDelResponsable sigue administrada en los services
# y las vistas pueden leer relaciones lazy (festival de la unidad, staff...)
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

