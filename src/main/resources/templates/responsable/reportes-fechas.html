<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Rentabilidad entre fechas')}"></head>
<body>
<th:block th:replace="~{fragments/layout :: menu('responsable')}"></th:block>

<div class="container angosto">
    <div class="header">
        <h1><svg class="icono"><use href="#i-calendar"/></svg> Rentabilidad entre fechas</h1>
        <p>
            <span th:text="${festival.nombre}">Festival</span>: del
            <span th:text="${#temporals.format(festival.fechaInicio, 'dd/MM/yyyy')}">01/01/2025</span> al
            <span th:text="${#temporals.format(festival.fechaFin, 'dd/MM/yyyy')}">31/01/2025</span>.
            Sueldos y canon se prorratean por los días del período.
        </p>
    </div>

    <div th:replace="~{fragments/layout :: mensajes}"></div>

    <div class="card">
        <form th:action="@{/responsable/reportes/fechas}" method="get">
            <div class="form-group">
                <label for="inicio">Desde</label>
                <input type="date" id="inicio" name="inicio" th:value="${inicio}"
                       th:min="${festival.fechaInicio}" th:max="${festival.fechaFin}" required>
            </div>
            <div class="form-group">
                <label for="fin">Hasta</label>
                <input type="date" id="fin" name="fin" th:value="${fin}"
                       th:min="${festival.fechaInicio}" th:max="${festival.fechaFin}" required>
            </div>
            <div class="form-buttons">
                <button type="submit" class="btn btn-primario">Calcular</button>
                <a th:href="@{/responsable/reportes}" class="btn btn-secondary">Volver a reportes</a>
            </div>
        </form>
    </div>

    <div class="card" th:if="${reporte != null}" th:with="neta=${reporte.rentabilidadNeta}">
        <h2><svg class="icono"><use href="#i-coins"/></svg> <span th:text="${reporte.nombreUnidad}">Unidad</span></h2>
        <p class="subtitulo">
            Del <span th:text="${#temporals.format(reporte.fechaInicio, 'dd/MM/yyyy')}">01/01</span>
            al <span th:text="${#temporals.format(reporte.fechaFin, 'dd/MM/yyyy')}">10/01</span>:
            <span th:text="${reporte.diasPeriodo}">10</span> de <span th:text="${reporte.diasFestival}">38</span> días del festival
        </p>
        <table>
            <tr><td>Recaudación</td>
                <td class="monto"><span th:replace="~{fragments/layout :: monto(${reporte.recaudacion})}"></span></td></tr>
            <tr><td>Costo de los platos</td>
                <td class="monto"><span th:replace="~{fragments/layout :: monto(${-reporte.costosPlatos})}"></span></td></tr>
            <tr><td>Sueldos (proporcional)</td>
                <td class="monto"><span th:replace="~{fragments/layout :: monto(${-reporte.sueldos})}"></span></td></tr>
            <tr><td>Canon (proporcional)</td>
                <td class="monto"><span th:replace="~{fragments/layout :: monto(${-reporte.canon})}"></span></td></tr>
            <tr class="total" th:classappend="${neta >= 0} ? 'positivo' : 'negativo'">
                <td>Rentabilidad neta</td>
                <td class="monto"><span th:replace="~{fragments/layout :: monto(${neta})}"></span></td></tr>
        </table>
    </div>
</div>
</body>
</html>
