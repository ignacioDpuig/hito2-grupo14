<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Activar cuenta')}"></head>
<body>
<svg th:replace="~{fragments/iconos :: sprite}"></svg>
<main class="auth-page">
    <div class="auth-card">
        <span class="marca"><span class="marca-logo"><svg class="icono"><use href="#i-utensils"/></svg></span> Epicentro Gourmet</span>
        <h1>Activá tu cuenta</h1>
        <p class="subtitulo">Elegí tu contraseña. Si sos responsable de una unidad de venta, al activarla también queda habilitada tu unidad.</p>

        <div th:if="${error}" class="alert alert-danger" role="alert">
            <svg class="icono"><use href="#i-alert"/></svg>
            <span th:text="${error}">Error</span>
        </div>

        <form th:action="@{/cambiar-password}" method="post">
            <div class="form-group">
                <label for="password">Contraseña nueva</label>
                <input type="password" id="password" name="password" autocomplete="new-password" required
                       th:attr="minlength=${largoMinimo}" autofocus>
                <small>Al menos <span th:text="${largoMinimo}">8</span> caracteres.</small>
            </div>
            <div class="form-group">
                <label for="confirmacion">Repetí la contraseña</label>
                <input type="password" id="confirmacion" name="confirmacion" autocomplete="new-password" required>
            </div>
            <button type="submit" class="btn btn-primario btn-bloque">Activar cuenta</button>
        </form>
        <form class="auth-pie" th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-sm btn-secondary"><svg class="icono"><use href="#i-logout"/></svg> Salir</button>
        </form>
    </div>
</main>
</body>
</html>
